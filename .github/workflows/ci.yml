name: Test and build

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit and bridge contract tests
        run: npm test
      - name: Typecheck and production web build
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser interaction tests
        run: npm run test:e2e
      - name: Save browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report-${{ matrix.os }}
          path: |
            artifacts/playwright-report/
            artifacts/test-results/
            artifacts/screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Build Windows portable and installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win portable nsis --x64 --publish never
      - name: Save Windows builds
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: super-codex-windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Save static web demo
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: super-codex-web-demo
          path: dist/
          if-no-files-found: error
          retention-days: 14
